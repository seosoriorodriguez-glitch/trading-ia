ftmo:
  account_size: 200000  # $200k FTMO Free Trial (test FVG) — el sizing usa --balance

  phase_1:
    profit_target_pct: 0.10   # 10%
    max_daily_loss_pct: 0.04  # 4% (1% margen antes del limite FTMO de 5%)
    max_total_loss_pct: 0.10  # 10%
    min_trading_days: 4

  phase_2:
    profit_target_pct: 0.05   # 5%
    max_daily_loss_pct: 0.04  # 4%
    max_total_loss_pct: 0.10  # 10%
    min_trading_days: 4

  refund: true
  rewards: 0.90

  close_before_weekend: true
  weekend_close_hour: 21      # Viernes 21:00 UTC

  risk_per_trade_pct: 0.005   # 0.5% del balance inicial
  max_simultaneous_trades: 3  # "natural": hasta 3 abiertas (1 por zona, rota al cerrar).
                              # El fix de concurrencia cuenta abiertas+pendientes <= 3,
                              # asi que es imposible pasar de 3 (acotado por max_active_fvgs=3).
  max_spread_points: 5        # No operar si spread > 5 pts
