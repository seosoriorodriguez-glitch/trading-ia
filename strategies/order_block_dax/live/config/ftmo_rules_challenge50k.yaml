ftmo:
  account_size: 50000   # Challenge DAX $50k (cuenta/terminal PROPIOS, no la del oro)

  phase_1:
    profit_target_pct: 0.10   # VERIFICAR el target real de TU challenge 50k (FTMO estandar
                              # phase 1 = 10% = $5,000). El bot PARA solo al alcanzarlo = el pase.
    max_daily_loss_pct: 0.04  # 4% = $2,000 (1% de margen antes del limite FTMO de 5%)
    max_total_loss_pct: 0.10  # 10% = $5,000
    min_trading_days: 4

  phase_2:
    profit_target_pct: 0.05   # 5%
    max_daily_loss_pct: 0.04
    max_total_loss_pct: 0.10
    min_trading_days: 4

  refund: true
  rewards: 0.90

  close_before_weekend: true
  weekend_close_hour: 19      # Viernes 19:00 UTC (regla FTMO 5.15.2)

  risk_per_trade_pct: 0.005   # 0.5% = $250/trade — IGUAL que US30 (validado: DAX +25% / DD 4.2%)
  max_simultaneous_trades: 1
  max_spread_points: 5        # DAX spread en precio (~1-3 pts); no operar si > 5

  # --- Filtro de noticias (FTMO 5.15.3, hora ET) ---
  news_filter: true
  news_blackout_et:
    - "08:26-08:34"   # macro 8:30 ET (NFP, CPI, PPI, Retail, GDP, PCE)
