ftmo:
  account_size: 10000  # $10k challenge

  phase_1:
    profit_target_pct: 0.10   # 10%
    max_daily_loss_pct: 0.04  # 4% (1% margen antes del limite FTMO de 5%)
    max_total_loss_pct: 0.10  # 10%
    min_trading_days: 4

  phase_2:
    profit_target_pct: 0.05   # 5%
    max_daily_loss_pct: 0.04  # 4% (1% margen antes del limite FTMO de 5%)
    max_total_loss_pct: 0.10  # 10%
    min_trading_days: 4

  refund: true
  rewards: 0.90

  close_before_weekend: true
  weekend_close_hour: 19      # Viernes 19:00 UTC = 15:00 NY = 22:00 servidor
                              # (cierra TODO ~1h antes del cierre del US30, regla FTMO 5.15.2)

  risk_per_trade_pct: 0.005   # 0.5% = $50 por trade con $10k
  max_simultaneous_trades: 2
  max_spread_points: 5        # No operar si spread > 5 pts

  # --- Filtro de noticias (regla FTMO 5.15.3, cuenta Standard) ---
  # No abrir trades NI dejar pendientes vivas en la ventana. Hora NUEVA YORK (ET):
  # se ancla a la hora real de la noticia US y se ajusta solo con el DST de EE.UU.
  # (independiente del horario del servidor/Europa que usan las sesiones).
  news_filter: true
  news_blackout_et:
    - "08:26-08:34"   # noticias macro de las 8:30 ET (NFP, CPI, PPI, Retail, GDP, PCE)
